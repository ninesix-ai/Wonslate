[package]
name = "translator-engine"
version = "0.1.0"
edition = "2021"
authors = ["ninesix-ai studio"]
description = "Wonslate local translation engine (zero-dependency cdylib)"
license = "Apache-2.0"
repository = "https://github.com/ninesix-ai/Wonslate"
keywords = ["translation", "offline", "engine"]
categories = ["text-processing"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0"
# v2.0 is built entirely on std + serde_json: zero extra external dependencies.
# (This also avoids Smart App Control interception of proc-macro / build-script
# recompilation on developer machines.)
