name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # re-run the gate on demand, without pushing a placeholder commit

# Third-party actions are pinned to full commit SHAs (verified against the
# upstream tag at audit time), not moving major tags; Dependabot
# (.github/dependabot.yml) raises pin-update PRs. The comment after each SHA
# records the tag that SHA was released under.
permissions:
  contents: read

jobs:
  rust:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # report every OS result instead of stopping at the first
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      # No Ollama / sidecar in CI: keep the documented degradation path fast.
      LT_OLLAMA_TIMEOUT_MS: 5000
      WONSLATE_OLLAMA_TIMEOUT_MS: 5000
      # Keep TM and config writes inside the job workspace, not the runner
      # profile. Both the legacy LT_ and the brand WONSLATE_ spelling are set.
      LT_DATA_DIR: ${{ github.workspace }}/.ci-data
      WONSLATE_DATA_DIR: ${{ github.workspace }}/.ci-data
    defaults:
      run:
        working-directory: translator-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: translator-engine
      - run: cargo build --release
      - run: cargo test --release
      # Per-OS native engine library: the building block for portable builds and
      # pre-release packages (the WPF client consumes the Windows dll).
      - name: Upload native engine library
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: translator-engine-${{ matrix.os }}
          path: |
            translator-engine/target/release/translator_engine.dll
            translator-engine/target/release/libtranslator_engine.so
            translator-engine/target/release/libtranslator_engine.dylib
          if-no-files-found: ignore

  python-ffi:
    name: Python FFI smoke
    runs-on: ubuntu-latest
    env:
      LT_DATA_DIR: ${{ github.workspace }}/.ci-data
      WONSLATE_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Build engine (cdylib)
        run: cargo build --release
        working-directory: translator-engine
      # The benchmark suites score with sacrebleu (script/bench_translation.py::score).
      # Without it the python-ffi job aborted before the later gates ever ran.
      # Pinned: same version the local bench baseline was measured with.
      - name: Install scoring dependency
        run: python -m pip install sacrebleu==2.6.0
      - name: Python smoke (FFI, sidecar e2e + unit, benchmark path + lint, hook guards)
        run: |
          python tests/test_phase1_ffi.py
          python tests/test_sidecar_e2e.py
          python tests/test_ct2_sidecar.py
          python tests/test_bench_flores.py
          python tests/test_bench_domain_av.py
          python tests/test_domain_pack_loader.py
          python tests/test_install_glossary_pack.py
          python tests/test_score_comet.py
          python tests/test_run_av_baseline.py
          python tests/test_xaml_lint.py
          python tests/test_pre_commit_hook.py
          python tests/test_glossary_hygiene.py
          python tests/test_component_licenses.py
          python tests/test_source_lint.py

  dotnet:
    name: .NET WPF (build + test)
    runs-on: windows-latest
    # Only this job publishes test results, so only this job gets check-write.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build Rust engine (dll for FFI)
        run: cargo build --release
        working-directory: translator-engine
      - name: Build WPF app
        run: dotnet build Wonslate.UI -c Release
      - name: Run .NET tests
        # Quoted because `run:` on windows-latest defaults to PowerShell, where the
        # ';' in trx;LogFileName=... is a statement separator: unquoted it aborts the
        # step with CommandNotFoundException and writes no .trx at all.
        run: >-
          dotnet test Wonslate.UI.Tests -c Release --nologo
          --logger "trx;LogFileName=wonslate-tests.trx"
          --results-directory TestResults
      # Publish the .trx as a check run with per-test annotations, so a failing case is
      # readable in the PR instead of only in the log. Pinned to the v3.0.0 commit
      # (a43b3a5f, 2026-03-21) rather than a moving tag: this is third-party code
      # running with check-write on our repo. always() so a red test still reports.
      #
      # use-actions-summary must be turned off explicitly: since v3 it defaults to true,
      # which writes the report into the job summary and never calls checks.create - the
      # reason the first two runs of this step went green without ever producing a check
      # run. Fork pull requests are the exception kept on the job summary on purpose:
      # they always run with a read-only token and cannot create check runs, so falling
      # back there keeps the report visible to outside contributors instead of failing.
      - name: Publish .NET test report
        if: always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: .NET WPF tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          use-actions-summary: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

  license-audit:
    name: License compliance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Layer 1 (crate deps): cargo-deny scans Cargo.lock against deny.toml's allow-list.
      # Uses the prebuilt binary action (no `cargo install`). Note the action's inputs are
      # kebab-case and it has no config-path input at all: an unknown key is silently
      # replaced by the action default (`./Cargo.toml`, which does not exist here), so the
      # manifest goes through `manifest-path` and deny.toml is passed explicitly via
      # `--config` rather than relying on implicit discovery.
      - name: cargo-deny (crate licenses)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses
          manifest-path: translator-engine/Cargo.toml
          arguments: --all-features --config translator-engine/deny.toml

      # Layer 2 (models/components): license_gate unit tests enforce the model/component
      # license allow-list, which cargo-deny cannot see (not crates.io entries).
      - uses: dtolnay/rust-toolchain@stable
      - name: license_gate audit (model/component layer)
        run: cargo test --release --lib license_gate
        working-directory: translator-engine

      # Layer 3 (NuGet / shipped components): cargo-deny and license_gate
      # cannot see the .csproj PackageReferences on their own; this stdlib
      # lint fails closed unless every package id is registered in
      # license_gate.rs with an allowed license and a provenance note.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: component license gate (NuGet / models / python deps)
        run: python tests/test_component_licenses.py

  coverage:
    name: Rust coverage baseline
    runs-on: ubuntu-latest
    continue-on-error: true   # baseline only; does not block the pipeline
    defaults:
      run:
        working-directory: translator-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: translator-engine
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --release --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: translator-engine/lcov.info
          flags: rust
          fail_ci_if_error: false
