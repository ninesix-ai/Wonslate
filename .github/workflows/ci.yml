name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # re-run the gate on demand, without pushing a placeholder commit

permissions:
  contents: read

jobs:
  rust:
    name: Rust engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # report every OS result instead of stopping at the first
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      # No Ollama / sidecar in CI: keep the documented degradation path fast.
      LT_OLLAMA_TIMEOUT_MS: 5000
      # Keep TM and config writes inside the job workspace, not the runner profile.
      LT_DATA_DIR: ${{ github.workspace }}/.ci-data
    defaults:
      run:
        working-directory: translator-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: translator-engine
      - run: cargo build --release
      - run: cargo test --release
      # Per-OS native engine library: the building block for portable builds and
      # pre-release packages (the WPF client consumes the Windows dll).
      - name: Upload native engine library
        uses: actions/upload-artifact@v4
        with:
          name: translator-engine-${{ matrix.os }}
          path: |
            translator-engine/target/release/translator_engine.dll
            translator-engine/target/release/libtranslator_engine.so
            translator-engine/target/release/libtranslator_engine.dylib
          if-no-files-found: ignore

  python-ffi:
    name: Python FFI smoke
    runs-on: ubuntu-latest
    env:
      LT_DATA_DIR: ${{ github.workspace }}/.ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build engine (cdylib)
        run: cargo build --release
        working-directory: translator-engine
      - name: Python smoke (FFI contract, sidecar e2e, ct2 unit, XAML lint)
        run: |
          python tests/test_phase1_ffi.py
          python tests/test_sidecar_e2e.py
          python tests/test_ct2_sidecar.py
          python tests/test_xaml_lint.py

  dotnet:
    name: .NET WPF (build + test)
    runs-on: windows-latest
    # Only this job publishes test results, so only this job gets check-write.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Rust engine (dll for FFI)
        run: cargo build --release
        working-directory: translator-engine
      - name: Build WPF app
        run: dotnet build Wonslate.UI -c Release
      - name: Run .NET tests
        run: >-
          dotnet test Wonslate.UI.Tests -c Release --nologo
          --logger trx;LogFileName=wonslate-tests.trx
          --results-directory TestResults
      # Publish the .trx as a check with per-test annotations, so a failing case is
      # readable in the PR instead of only in the log. Pinned to the v3.0.0 commit
      # (a43b3a5f, 2026-03-21) rather than a moving tag: this is third-party code
      # running with check-write on our repo. always() so a red test still reports.
      # continue-on-error: pull_request from a fork always gets a read-only token,
      # so checks: write cannot be honoured there and the report cannot be created.
      # The previous step already decides pass/fail; a missing report stays a
      # convenience loss, never a false red for an outside contributor.
      - name: Publish .NET test report
        if: always()
        continue-on-error: true
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: .NET WPF tests
          path: TestResults/*.trx
          reporter: dotnet-trx

  license-audit:
    name: License compliance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Layer 1 (crate deps): cargo-deny scans Cargo.lock against deny.toml's allow-list.
      # Uses the prebuilt binary action (no `cargo install`). Note the action's inputs are
      # kebab-case and it has no config-path input at all: an unknown key is silently
      # replaced by the action default (`./Cargo.toml`, which does not exist here), so the
      # manifest goes through `manifest-path` and deny.toml is passed explicitly via
      # `--config` rather than relying on implicit discovery.
      - name: cargo-deny (crate licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
          manifest-path: translator-engine/Cargo.toml
          arguments: --all-features --config translator-engine/deny.toml

      # Layer 2 (models/components): license_gate unit tests enforce the model/component
      # license allow-list, which cargo-deny cannot see (not crates.io entries).
      - uses: dtolnay/rust-toolchain@stable
      - name: license_gate audit (model/component layer)
        run: cargo test --release --lib license_gate
        working-directory: translator-engine

  coverage:
    name: Rust coverage baseline
    runs-on: ubuntu-latest
    continue-on-error: true   # baseline only; does not block the pipeline
    defaults:
      run:
        working-directory: translator-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: translator-engine
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --release --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: translator-engine/lcov.info
          flags: rust
          fail_ci_if_error: false
